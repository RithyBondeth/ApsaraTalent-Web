version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # Production runs on Vercel, so this Dockerfile is not the shipping path — but
  # it is the documented self-host path and drifts silently without this.
  # `npm audit` cannot see CVEs in the node:alpine base layer.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns:
          - "*"
