version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # eslint-config-next major must move with `next` itself. Offered on its
      # own (PR #122: 15.5.22 -> 16.3.0 against next@15) it only fails config
      # validation, which is not fixable from our side. Drop this entry as part
      # of the Next 16 upgrade.
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  # Production runs on Vercel, so this Dockerfile is not the shipping path — but
  # it is the documented self-host path and drifts silently without this.
  # `npm audit` cannot see CVEs in the node:alpine base layer.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 2
    groups:
      docker-base-images:
        patterns:
          - "*"
