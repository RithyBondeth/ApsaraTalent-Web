name: Verify and deploy web

# Production is deployed from this workflow, not by Vercel's Git integration.
# `git.deploymentEnabled.main = false` in vercel.json turns off the automatic
# push-to-main deploy, so the `deploy` job below is the only path to production
# and every check above it is a real gate. Preview deploys for other branches
# still come from the Git integration and are verified by verify-deployment.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  # Preview builds can be superseded. Never interrupt a production release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NEXT_PUBLIC_* is public by definition — it ships in the client bundle.
      # The two SENTRY_* names are the server-side twins of NEXT_PUBLIC_ values
      # already in this file: an environment label and a trace sample rate.
      # Neither is a credential. Anything else server-side belongs in the
      # platform's own environment configuration, not in a tracked file.
      - name: Reject server secrets in the tracked production environment
        shell: bash
        run: |
          allowed='^(#|[[:space:]]*$|NEXT_PUBLIC_[A-Z0-9_]+=|SENTRY_ENVIRONMENT=|SENTRY_TRACES_SAMPLE_RATE=)'
          invalid=$(grep -Ev "$allowed" .env.production | grep -E '^[A-Z][A-Z0-9_]*=' || true)
          if [[ -n "$invalid" ]]; then
            echo "::error::.env.production may contain NEXT_PUBLIC_*, SENTRY_ENVIRONMENT and SENTRY_TRACES_SAMPLE_RATE only."
            echo "$invalid" | sed 's/=.*$/=[redacted]/'
            exit 1
          fi

      - name: Reject credential-shaped literals
        shell: bash
        run: |
          if git grep -nIE \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e "(postgres(ql)?|mysql|mongodb(\\+srv)?|redis|rediss|amqps?)://[^[:space:]\"']+:[^[:space:]\"']+@" \
            -- ':!package-lock.json' ':!.env.production'; then
            echo "::error::Possible hard-coded credential above. Move it to a secret store."
            exit 1
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Capture complete production dependency audit
        run: npm audit --omit=dev --json > dependency-audit.json || true

      - name: Reject high or critical production advisories
        run: npm run security:audit

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository environments
        run: npm run check:env -- production

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      # Asserts every design token still clears WCAG AA against the surface it
      # sits on, and that raw palette classes (bg-green-100 and friends) have
      # not crept back past their baseline.
      - name: Check design tokens
        run: npm run check:design

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security, dependencies, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test:ci

  build:
    name: Production build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [security, dependencies, lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Browser journeys intercept this local origin and never touch production.
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:13000"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run standalone smoke and browser journeys
        run: E2E_SKIP_BUILD=1 npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [security, dependencies, lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require deployment credentials
        shell: bash
        run: |
          # PRODUCTION_WEB_URL is required, not optional: it is the origin the
          # release is verified against. Without it a deploy cannot be proven,
          # and an unprovable deploy is what let a broken release look fine.
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID PRODUCTION_WEB_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required to deploy to production."
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@58.7.1

      # Pulls the project's own production environment variables. Vercel project
      # settings stay the source of truth for runtime config; CI only supplies
      # the build-time Sentry credentials below.
      - name: Pull production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}

      # --prebuilt ships the artifact built and verified above. Without it Vercel
      # rebuilds from source and the thing tested is not the thing served.
      - name: Deploy prebuilt bundle
        id: deploy
        shell: bash
        run: |
          # The CLI writes progress to stderr and the deployment URL to stdout;
          # take the last line so a stray stdout notice cannot become the URL.
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n1)
          if [[ ! "$url" =~ ^https:// ]]; then
            echo "::error::Expected a deployment URL, got: $url"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed $url"

      # The production alias is the gate, because it is what users actually hit.
      # EXPECTED_RELEASE makes this prove the NEW build is serving: a healthy
      # response from the previous deployment would otherwise pass.
      - name: Verify the production domain
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: node scripts/verify-deployment.mjs "$PRODUCTION_WEB_URL"

      # Best-effort only. Deployment URLs sit behind Deployment Protection,
      # which serves an HTML login page instead of the app, so this cannot be a
      # gate — it failed the first real release for exactly that reason while
      # the alias above was healthy the whole time.
      - name: Probe the deployment URL directly
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          DEPLOY_VERIFY_TIMEOUT_MS: "30000"
        run: node scripts/verify-deployment.mjs "${{ steps.deploy.outputs.url }}"

      # Vercel deployments are immutable, so rollback is an alias switch back to
      # the previous production deployment — fast, and safe to automate. It is
      # NOT safe if this release shipped a breaking API contract; see
      # ../ApsaraTalent-Api/docs/RUNBOOK.md §5 before assuming this is enough.
      - name: Roll back to the previous production deployment
        if: failure() && steps.deploy.outcome == 'success'
        shell: bash
        env:
          # Proves the alias moved OFF this release. `vercel rollback` has been
          # observed exiting 0 without changing anything, and a rollback that
          # reports success without acting is worse than none — you stand down
          # believing production was reverted.
          REJECTED_RELEASE: ${{ github.sha }}
        run: |
          echo "::warning::Verification failed. Rolling back to the previous production deployment."
          rollback_ok=0
          vercel rollback --yes --timeout 5m --token="$VERCEL_TOKEN" || rollback_ok=$?

          if node scripts/verify-deployment.mjs "$PRODUCTION_WEB_URL"; then
            {
              echo "### ↩️ Rolled back"
              echo ""
              echo "\`${{ steps.deploy.outputs.url }}\` failed verification. The"
              echo "production alias no longer serves \`${{ github.sha }}\` and the"
              echo "origin is healthy."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### 🚨 Rollback did NOT take effect"
              echo ""
              echo "\`vercel rollback\` exited \`${rollback_ok}\`, but the production"
              echo "domain is still serving \`${{ github.sha }}\` or is unhealthy."
              echo ""
              echo "**Use Instant Rollback in the Vercel dashboard now.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Rollback did not take effect. Use Instant Rollback in the Vercel dashboard now."
            exit 1
          fi
