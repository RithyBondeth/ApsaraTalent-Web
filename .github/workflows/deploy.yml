name: Verify and deploy web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  # Preview builds can be superseded. Never interrupt a production release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Secret policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Reject server secrets in the tracked production environment
        shell: bash
        run: |
          invalid=$(grep -Ev '^(#|[[:space:]]*$|NEXT_PUBLIC_[A-Z0-9_]+=|SENTRY_ENVIRONMENT=)' .env.production | grep -E '^[A-Z][A-Z0-9_]*=' || true)
          if [[ -n "$invalid" ]]; then
            echo "::error::.env.production may contain public NEXT_PUBLIC_* values and SENTRY_ENVIRONMENT only."
            echo "$invalid" | sed 's/=.*$/=[redacted]/'
            exit 1
          fi

      - name: Reject credential-shaped literals
        shell: bash
        run: |
          if git grep -nIE \
            -e 'sk-[A-Za-z0-9]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            -e '(postgres(ql)?|mysql|mongodb(\+srv)?|redis|rediss|amqps?)://[^[:space:]"'"']+:[^[:space:]"'"']+@' \
            -- ':!package-lock.json' ':!.env.production'; then
            echo "::error::Possible hard-coded credential above. Move it to a secret store."
            exit 1
          fi

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Capture complete production dependency audit
        run: npm audit --omit=dev --json > dependency-audit.json || true

      - name: Reject high or critical production advisories
        run: npm run security:audit

      - name: Upload dependency audit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository environments
        run: npm run check:env

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security, dependencies, lint]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm run test:ci

  build:
    name: Production build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [security, dependencies, lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Browser journeys intercept this local origin and never touch production.
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:13000"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run standalone smoke and browser journeys
        run: E2E_SKIP_BUILD=1 npm run test:e2e

      - name: Upload browser test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failures
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [security, dependencies, lint, test, build]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Vercel credentials
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for preview deployment."
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pull preview environment
        run: npx --yes vercel@58.4.4 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build Vercel artifact
        run: npx --yes vercel@58.4.4 build --token="$VERCEL_TOKEN"

      - name: Deploy verified preview artifact
        id: deploy
        shell: bash
        run: |
          deployment_url=$(npx --yes vercel@58.4.4 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployed to $deployment_url"

      - name: Verify preview health
        run: npm run verify:deployment -- "${{ steps.deploy.outputs.deployment_url }}"

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [security, dependencies, lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      SENTRY_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Require Vercel credentials
        shell: bash
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is required for production deployment."
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pull production environment
        run: npx --yes vercel@58.4.4 pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build Vercel production artifact
        run: npx --yes vercel@58.4.4 build --prod --token="$VERCEL_TOKEN"

      - name: Deploy verified production artifact
        id: deploy
        shell: bash
        run: |
          deployment_url=$(npx --yes vercel@58.4.4 deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Production deployed to $deployment_url"

      - name: Verify production health
        run: npm run verify:deployment -- "${{ steps.deploy.outputs.deployment_url }}"
